<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>의사소통 · 비밀번호 재설정</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f4f7f2;color:#243d31;margin:0;padding:24px}main{max-width:440px;margin:8vh auto;background:white;padding:28px;border-radius:18px}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border:1px solid #bacabd;border-radius:10px}input{margin-top:8px}button{background:#2c6348;color:white;cursor:pointer}p{line-height:1.7}a{color:#2c6348}[hidden]{display:none!important}</style><main><h1>비밀번호 재설정</h1><p id="status" role="status">이메일 링크를 확인하고 있습니다.</p><form id="form" hidden><label>새 비밀번호<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>새 비밀번호 확인<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button id="save">새 비밀번호 저장</button></form><p><a href="./">의사소통 앱으로 돌아가기</a></p></main><script src="./cloud-config.js"></script><script>
'use strict';
const parts=new URLSearchParams(location.hash.slice(1));let recoveryToken=parts.get('type')==='recovery'?parts.get('access_token'):null;const linkError=parts.get('error_description');history.replaceState(null,'',location.pathname);
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
if(recoveryToken){form.hidden=false;status.textContent='새 비밀번호를 두 번 입력하세요. 8자 이상으로 설정해 주세요.';}else{status.textContent=linkError?'링크가 만료되었거나 유효하지 않습니다. 새 재설정 이메일을 받아주세요.':'Supabase에서 보낸 비밀번호 재설정 이메일의 링크로 열어주세요. 링크가 만료되었다면 새 이메일을 받아주세요.';}
form.onsubmit=async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='두 비밀번호가 일치하지 않습니다.';return;}save.disabled=true;try{const c=window.AAC_CLOUD;if(!c?.url||!c.publicKey)throw Error('앱 연결 설정이 없습니다.');const r=await fetch(c.url+'/auth/v1/user',{method:'PUT',headers:{apikey:c.publicKey,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'저장하지 못했습니다.');recoveryToken=null;form.reset();form.hidden=true;status.textContent='비밀번호를 변경했습니다. 앱으로 돌아가 이메일과 새 비밀번호로 로그인하세요.';}catch(err){status.textContent=err.message;save.disabled=false;}};
</script></html>
