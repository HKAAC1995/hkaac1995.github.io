'use strict';
const $=s=>document.querySelector(s);const stages=[['초등',6],['중등',3],['고등',3],['전공과',2]];let db,state,path=[],mode='tablet',manage=false,selected=new Set(),teacher=false,commonData,localDraft=null,installPrompt=null,syncing=false;
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function initial(){return{schema:1,subjects:[],units:[],cards:[]}}
function notify(s,error=false){$('#status').textContent=s;$('#status').className='status'+(error?' alert':'')}
function btn(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=()=>Promise.resolve().then(fn).catch(e=>notify(e.message,true));return b}

function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('school-aac-web-v2',1);q.onupgradeneeded=()=>q.result.createObjectStore('data');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}

function navigate(v){path.push(v);manage=false;render()}

function currentCards(){return state.cards.filter(c=>c.unit===path[3])}
function tile(label,detail,fn){const b=btn('',fn,'tile');b.append(element('strong',label));if(detail)b.append(element('small',detail));return b}
function render(){$('#teacher').textContent=teacher?'공통자료로 돌아가기':'관리자 로그인';$('#data').textContent=teacher?'공동 게시·백업':'공유·사용안내';$('#back').disabled=path.length===0;const crumbs=$('#crumb');crumbs.replaceChildren();['처음',...path.map((p,i)=>i===1?p+'학년':i===3?(state.units.find(u=>u.id===p)?.name||'단원'):p)].forEach((s,i)=>{if(i)crumbs.append(element('span','›'));crumbs.append(btn(s,()=>{path=path.slice(0,i);manage=false;render()}))});$('#basket b').textContent=selected.size;const tools=$('#tools'),c=$('#content');tools.replaceChildren();c.replaceChildren();const title=$('#title'),intro=$('#intro');const grid=element('div',undefined,'grid');c.append(grid);
if(path.length===0){title.textContent='학교급을 선택해 주세요';intro.textContent='학교급 → 학년 → 교과 → 단원 → 의사소통카드';stages.forEach(([s,n])=>grid.append(tile(({'초등':'초등학교','중등':'중학교','고등':'고등학교'})[s]||s,'1학년 ~ '+n+'학년',()=>navigate(s))))}
if(path.length===1){title.textContent=path[0]+' · 학년 선택';intro.textContent='수업할 학년을 선택해 주세요.';for(let n=1;n<=stages.find(s=>s[0]===path[0])[1];n++)grid.append(tile(n+'학년','교과 보기',()=>navigate(n)))}
if(path.length===2){title.textContent=path[0]+' '+path[1]+'학년 · 교과';intro.textContent=path[0]==='초등'?'필요한 교과를 선택하세요. 교과는 추가할 수 있습니다.':'필요한 교과를 등록해 주세요.';subjects().forEach(s=>grid.append(tile(s,'단원 보기',()=>navigate(s))));tools.append(btn('+ 교과 추가',addSubject));if(!subjects().length)c.append(element('div','아직 등록된 교과가 없습니다. 위의 ‘교과 추가’를 눌러 주세요.','empty'))}
if(path.length===3){title.textContent=path[2]+' · 단원';intro.textContent='실제 교과서에 맞춰 단원을 추가하고 카드 이미지를 등록하세요.';currentUnits().forEach(u=>grid.append(tile(u.name,state.cards.filter(c=>c.unit===u.id).length+'장의 카드',()=>navigate(u.id))));tools.append(btn('+ 단원 추가',addUnit));if(!currentUnits().length)c.append(element('div','등록된 단원이 없습니다. ‘단원 추가’부터 시작하세요.','empty'))}
if(path.length===4){title.textContent=state.units.find(u=>u.id===path[3])?.name||'단원';intro.textContent=manage?'카드 이름을 수정하거나 필요 없는 카드를 삭제할 수 있습니다.':mode==='tablet'?'카드를 누르면 선택한 말이 아래에 크게 나타납니다.':'필요한 카드를 눌러 인쇄함에 담으세요.';const switches=element('div',undefined,'row');switches.append(btn('태블릿으로 사용',()=>{mode='tablet';manage=false;render()},mode==='tablet'&&!manage?'primary':''),btn('인쇄할 카드 선택',()=>{mode='print';manage=false;render()},mode==='print'&&!manage?'primary':''));const ops=element('div',undefined,'row');ops.append(btn('+ 카드 추가',addCards),btn('카드 관리',()=>{manage=!manage;render()}),btn('단원 이름 수정',renameUnit));tools.append(switches,ops);if(mode==='print'&&!manage){tools.append(btn('이 단원 모두 담기',()=>{currentCards().forEach(x=>selected.add(x.id));render()}))}currentCards().forEach(card=>{if(manage){const box=element('div',undefined,'panel');box.append(cardButton(card),btn('이름 수정',()=>renameCard(card)),btn('삭제',()=>deleteCard(card),'danger'));grid.append(box)}else grid.append(cardButton(card))});if(!currentCards().length)c.append(element('div','카드를 추가해 주세요. 개별 카드 이미지 여러 장을 한 번에 등록하거나 글자 카드부터 만들 수 있습니다.','empty'));const response=element('div','카드를 선택해 주세요.','response');response.id='response';response.setAttribute('aria-live','polite');if(mode!=='tablet'||manage)response.hidden=true;c.append(response)}
if(!teacher){if(path.length===3)intro.textContent='수업할 단원을 선택해 주세요.';if(path.length===2)intro.textContent='수업할 교과를 선택해 주세요.';[...tools.querySelectorAll('button')].filter(b=>['+ 교과 추가','+ 단원 추가','+ 카드 추가','카드 관리','단원 이름 수정'].includes(b.textContent)).forEach(b=>b.remove());if(path.length===2&&!subjects().length||path.length===3&&!currentUnits().length||path.length===4&&!currentCards().length){const blank=c.querySelector('.empty');if(blank)blank.textContent='아직 게시된 공통 자료가 없습니다. 담당 교사가 자료를 게시하면 여기에 표시됩니다.'}}
}
function cardButton(card){const b=btn('',()=>{if(manage)return;if(mode==='print'){selected.has(card.id)?selected.delete(card.id):selected.add(card.id);b.setAttribute('aria-pressed',String(selected.has(card.id)));$('#basket b').textContent=selected.size}else{$('#response').textContent=card.name}},'tile vocab');b.setAttribute('aria-label',card.name);if(mode==='print'&&!manage)b.setAttribute('aria-pressed',String(selected.has(card.id)));if(card.image){const img=new Image();img.src=card.image;img.alt='';b.append(img,element('strong',card.name))}else b.append(element('span',card.name,'wordonly'));return b}
function formDialog(title,build,save){const d=$('#dialog');d.replaceChildren();const f=element('form');f.append(element('h2',title));build(f);const a=element('div',undefined,'actions');a.append(btn('취소',()=>d.close()));const submit=element('button','저장','primary');submit.type='submit';a.append(submit);f.append(a);f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await save(new FormData(f));d.close()}catch(err){notify(err.message,true);submit.disabled=false}};d.append(f);d.showModal();return d}
function field(f,label,name,value='',type='text'){const l=element('label',label);const input=document.createElement('input');input.name=name;input.type=type;input.value=value;input.required=true;l.append(input);f.append(l);return input}
function addSubject(){formDialog('교과 추가',f=>field(f,'교과 이름','name'),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('교과 이름을 입력해 주세요.');if(subjects().includes(name))throw Error('이미 있는 교과입니다.');await commit({...state,subjects:[...state.subjects,{stage:path[0],grade:path[1],name}]})})}
function addUnit(){formDialog('단원 추가',f=>field(f,'단원 이름 (예: 1. 시간 경험하기)','name'),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('단원 이름을 입력해 주세요.');await commit({...state,units:[...state.units,{id:id(),stage:path[0],grade:path[1],subject:path[2],name}]})})}
function renameUnit(){const u=state.units.find(u=>u.id===path[3]);formDialog('단원 이름 수정',f=>field(f,'단원 이름','name',u.name),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('이름을 입력해 주세요.');await commit({...state,units:state.units.map(x=>x.id===u.id?{...x,name}:x)})})}
function renameCard(card){formDialog('카드 이름 수정',f=>field(f,'카드 이름','name',card.name),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('이름을 입력해 주세요.');await commit({...state,cards:state.cards.map(x=>x.id===card.id?{...x,name}:x)})})}
async function deleteCard(card){if(!confirm('‘'+card.name+'’ 카드를 삭제할까요?'))return;await commit({...state,cards:state.cards.filter(x=>x.id!==card.id)});selected.delete(card.id);render()}
function loadImage(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)){reject(Error('PNG, JPG, WEBP 이미지로 등록해 주세요.'));return}if(file.size>20*1024*1024){reject(Error('한 이미지의 크기는 20MB 이하로 해 주세요.'));return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const k=Math.min(1,1000/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/png'))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽을 수 없습니다.'))};img.src=url})}
function addCards(){let files;formDialog('이 단원에 카드 추가',f=>{f.append(element('p','개별 카드 이미지 파일을 선택하세요. 파일명이 카드 이름이 됩니다. 여러 카드가 붙어 있는 한 장의 이미지는 먼저 카드별로 나누어 주세요.','help'));files=field(f,'이미지 파일 (여러 장 선택 가능)','files','','file');files.multiple=true;files.accept='image/png,image/jpeg,image/webp';files.required=false;const name=field(f,'카드 이름 (이미지 없이 글자 카드 생성 / 이미지 1장일 때 이름 지정)','name');name.required=false},async fd=>{const list=[...files.files],name=String(fd.get('name')).trim();if(!list.length&&!name)throw Error('이미지를 선택하거나 카드 이름을 입력해 주세요.');const added=[];for(const file of list){added.push({id:id(),unit:path[3],name:list.length===1&&name?name:file.name.replace(/\.[^.]+$/,''),image:await loadImage(file)})}if(!list.length)added.push({id:id(),unit:path[3],name,image:''});await commit({...state,cards:[...state.cards,...added]})})}
function chosen(){return state.cards.filter(c=>selected.has(c.id))}
function sheet(cards,size,labels,layout){const sheet=element('div',undefined,'printsheet');if(layout==='board'){const title=element('h2','나의 의사소통판');title.style.width='100%';sheet.append(title)}cards.forEach(card=>{const item=element('div',undefined,'printcard'+(!labels?' nolabel':''));item.style.width=size+'mm';item.style.height=size+'mm';if(card.image){const img=new Image();img.src=card.image;img.alt=card.name;item.append(img)}if(labels||!card.image)item.append(element('span',card.name));sheet.append(item)});return sheet}

function download(name,text){const blob=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateBackup(x){if(!x||x.schema!==1||!Array.isArray(x.subjects)||!Array.isArray(x.units)||!Array.isArray(x.cards))throw Error('이 앱의 백업 파일이 아닙니다.');const stageOK=(s,g)=>stages.some(v=>v[0]===s&&Number.isInteger(g)&&g>=1&&g<=v[1]);if(x.subjects.some(s=>!stageOK(s.stage,s.grade)||typeof s.name!=='string'||!s.name.trim())||x.units.some(u=>!stageOK(u.stage,u.grade)||typeof u.id!=='string'||typeof u.name!=='string'||typeof u.subject!=='string'))throw Error('교과·단원 정보가 잘못된 파일입니다.');const ids=new Set(x.units.map(u=>u.id));if(ids.size!==x.units.length||new Set(x.cards.map(c=>c.id)).size!==x.cards.length||x.cards.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!ids.has(c.unit)||typeof c.image!=='string'||(c.image&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(c.image))))throw Error('카드 정보가 잘못된 파일입니다.');return x}

function readKey(key){return new Promise((resolve,reject)=>{const q=db.transaction('data').objectStore('data').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function writeKey(key,value){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('저장 실패'))})}

const cloudConfig=window.AAC_CLOUD||{};
const cloudReady=()=>/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cloudConfig.url||'')&&!!cloudConfig.publicKey;
async function cloudRequest(route,body,auth=false){
 if(!cloudReady())throw Error('공동 저장소 연결 전입니다. 담당자의 최초 설정이 필요합니다.');
 if(auth&&!cloudSession)throw Error('관리자로 로그인해 주세요.');
 if(auth&&Date.now()>cloudSession.expires_at-60000){
  const r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});setSession(r);
 }
 const response=await fetch(cloudConfig.url+route,{method:'POST',headers:{apikey:cloudConfig.publicKey,'Content-Type':'application/json',...(auth&&cloudSession?{Authorization:'Bearer '+cloudSession.access_token}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});

}
function setSession(data){cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,user_id:data.user?.id||cloudSession?.user_id,expires_at:Date.now()+data.expires_in*1000};}
function recordMap(pack){const m=new Map();for(const kind of ['subjects','units','cards'])for(const value of pack[kind]){const key=kind==='subjects'?JSON.stringify([value.stage,value.grade,value.name]):value.id;m.set(kind+':'+key,{kind,key,value});}return m;}
function changesBetween(before,after){const a=recordMap(before),b=recordMap(after),changes=[];for(const key of new Set([...a.keys(),...b.keys()])){const old=a.get(key),next=b.get(key);if(JSON.stringify(old?.value)!==JSON.stringify(next?.value))changes.push({kind:(next||old).kind,key:(next||old).key,before:old?.value||null,after:next?.value||null});}return changes;}

function renderPersonal(){const book=personalBook||newPersonalBook();$('#title').textContent='나만의 AAC';$('#intro').textContent='우리 반 카드 · 이 기기에 자동 저장 · 카드북 파일로 옮겨 사용';$('#crumb').replaceChildren(btn('학교 공통 자료',()=>{personalView=false;render();}));$('#back').disabled=false;$('#basket b').textContent=selected.size;const tools=$('#tools');tools.replaceChildren();const select=element('select');select.setAttribute('aria-label','카드 묶음');for(const group of ['전체',...new Set(book.cards.map(c=>c.group))]){const o=element('option',group);o.value=group;select.append(o);}if(![...select.options].some(o=>o.value===personalGroup))personalGroup='전체';select.value=personalGroup;select.onchange=()=>{personalGroup=select.value;render();};tools.append(select,btn('+ 카드 추가',personalAdd),btn('웹 이미지 가져오기',personalURL),btn('카드 관리',()=>{personalManage=!personalManage;render();}),btn(mode==='print'?'태블릿으로 사용':'인쇄할 카드 선택',()=>{mode=mode==='print'?'tablet':'print';render();}),btn('카드북 저장',()=>download('나만의_AAC_카드북.json',JSON.stringify(book))),btn('카드북 불러오기',personalImport),btn('자료 사이트',()=>window.open('http://symbol.ksaac.or.kr/index.jsp','_blank','noopener,noreferrer')));const c=$('#content');c.replaceChildren();const grid=element('div',undefined,'grid');c.append(grid);for(const card of book.cards.filter(c=>personalGroup==='전체'||c.group===personalGroup)){if(personalManage){const box=element('div',undefined,'panel');box.append(personalCard(card),btn('이름·묶음 수정',()=>personalEdit(card)),btn('삭제',async()=>{if(!confirm('‘'+card.name+'’ 카드를 나만의 AAC에서 삭제할까요?'))return;await savePersonal({...book,cards:book.cards.filter(c=>c.id!==card.id)});selected.delete(card.id);render();},'danger'));if(card.source){const a=element('a','출처 열기');a.href=card.source;a.target='_blank';a.rel='noopener noreferrer';box.append(a);}if(card.license)box.append(element('p',card.license,'help'));grid.append(box);}else grid.append(personalCard(card));}if(!book.cards.length)c.append(element('p','카드 추가로 이미지 여러 장을 올리거나, 학교 공통 단원에서 카드를 function personalEdit(card){formDialog('카드 수정',f=>{field(f,'카드 이름','name',card.name);field(f,'카드 묶음','group',card.group);},async fd=>{const name=String(fd.get('name')).trim(),group=String(fd.get('group')).trim();if(!name||!group)throw Error('이름과 카드 묶음을 입력해 주세요.');await savePersonal({...personalBook,cards:personalBook.cards.map(c=>c.id===card.id?{...c,name,group}:c)});});}
function personalAdd(){let files;formDialog('나만의 카드 추가',f=>{files=field(f,'카드 이미지 (여러 장 선택 가능)','files','','file');files.accept='image/png,image/jpeg,image/webp';files.multiple=true;files.required=false;const n=field(f,'카드 이름 (이미지 1장이거나 글자 카드일 때)','name');n.required=false;field(f,'카드 묶음','group',personalGroup==='전체'?'우리 반':personalGroup);},async fd=>{const list=[...files.files],name=String(fd.get('name')).trim(),group=String(fd.get('group')).trim();if(!group||(!list.length&&!name))throw Error('묶음 이름과 이미지 또는 카드 이름을 입력해 주세요.');const added=[];for(const file of list)added.push({id:'personal-'+id(),name:list.length===1&&name?name:file.name.replace(/\.[^.]+$/,''),group,image:await loadImage(file)});if(!list.length)added.push({id:'personal-'+id(),name,group,image:''});await savePersonal({...personalBook,cards:[...personalBook.cards,...added]});});}
async function fetchWebImage(url){const r=await fetch(safeWebURL(url),{mode:'cors',credentials:'omit',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('이미지 응답 오류');if(!/^image\/(png|jpeg|webp)(;|$)/i.test(r.headers.get('content-type')||''))throw Error('웹페이지 주소 대신 PNG·JPG·WEBP 이미지 자체의 주소를 입력해 주세요.');const blob=await r.blob();return await loadImage(new File([blob],'web-image',{type:blob.type.split(';')[0]}));}
function personalURL(){formDialog('웹 이미지 가져오기',f=>{f.append(element('p','이미지 자체의 https 주소를 입력하세요. 허용된 이미지를 복사해 이 기기에 저장합니다. 사이트에서 직접 가져오기를 막으면 이미지를 내려받아 카드 추가로 등록하세요.','help'));field(f,'이미지 주소','url','','url');field(f,'카드 이름','name');field(f,'카드 묶음','group',personalGroup==='전체'?'우리 반':personalGroup);const source=field(f,'출처 페이지 주소 (선택)','source','','url');source.required=false;const license=field(f,'저작자·이용 조건 메모 (선택)','license');license.required=false;},async fd=>{const url=safeWebURL(String(fd.get('url')).trim()),name=String(fd.get('name')).trim(),group=String(fd.get('group')).trim();if(!name||!group)throw Error('이름과 묶음을 입력해 주세요.');let image;try{image=await fetchWebImage(url);}catch(e){throw Error('직접 가져오지 못했습니다. '+e.message+' 사이트에서 이미지 파일을 내려받은 뒤 카드 추가를 이용하세요.');}await savePersonal({...personalBook,cards:[...personalBook.cards,{id:'personal-'+id(),name,group,image,source:fd.get('source')?safeWebURL(String(fd.get('source'))):url,license:String(fd.get('license')).trim()}]});});}
function personalImport(){formDialog('카드북 불러오기',f=>{const input=field(f,'다른 기기에서 저장한 카드북 JSON','book','','file');input.accept='.json,application/json';f.append(element('p','현재 카드는 유지하고 추가합니다. 같은 카드가 수정되어 있으면 별도 카드로 보관합니다.'));},async fd=>{const file=fd.get('book');if(!file||file.size>100*1024*1024)throw Error('100MB 이하 카드북을 선택해 주세요.');const pack=validatePersonal(JSON.parse(await file.text()));const cards=[...personalBook.cards];for(const c of pack.cards){const existing=cards.find(x=>x.id===c.id);if(existing&&JSON.stringify(existing)===JSON.stringify(c))continue;cards.push(existing?{...c,id:'personal-'+id()}:c);}const links=[...personalBook.links];for(const l of pack.links)if(!links.some(x=>x.url===l.url))links.push(l);await savePersonal({...personalBook,cards,links});});}
function personalSites(){const d=$('#dialog');d.replaceChildren();d.append(element('h2','카드 자료 사이트'));const kaac=element('a','한국형 AAC 상징 검색 사이트 열기');kaac.href='http://symbol.ksaac.or.kr/index.jsp';kaac.target='_blank';kaac.rel='noopener noreferrer';d.append(kaac,element('p','이 사이트는 새 창으로 엽니다. 이미지를 저장한 뒤 나만의 AAC의 카드 추가로 등록하세요. 사이트에서 허용하는 이용 조건을 확인해 주세요.','help'));for(const link of personalBook.links){const row=element('div',undefined,'row');const a=element('a',link.name);a.href=link.url;a.target='_blank';a.rel='noopener noreferrer';row.append(a,btn('목록에서 삭제',async()=>{await savePersonal({...personalBook,links:personalBook.links.filter(l=>l!==link)});d.close();personalSites();}));d.append(row);}d.append(element('p','사이트를 열어 이미지를 찾고, 이미지 주소 가져오기 또는 파일 업로드로 저장할 수 있습니다. 사이트별 검색·자동 가져오기는 해당 사이트 지원 여부 확인이 필요합니다.','help'));d.append(btn('사이트 추가',()=>{d.close();formDialog('자료 사이트 추가',f=>{field(f,'사이트 이름','name');field(f,'사이트 주소','url','','url');},async fd=>{await savePersonal({...personalBook,links:[...personalBook.links,{name:String(fd.get('name')).trim(),url:safeWebURL(String(fd.get('url')).trim())}]});});}),btn('닫기',()=>d.close()));d.showModal();}
async function copyCommonUnit(){await getPersonal();const cards=currentCards();if(!cards.length)throw Error('복사할 카드가 없습니다.');const unit=state.units.find(u=>u.id===path[3]);const added=cards.map(c=>({...c,id:'personal-'+id(),group:unit.name}));await savePersonal({...personalBook,cards:[...personalBook.cards,...added]});notify('나만의 AAC에 '+added.length+'장을 복사했습니다. 학교 공통 원본은 유지됩니다.');}
const sharedChosen=chosen;chosen=function(){return [...sharedChosen(),...(personalBook?.cards||[]).filter(c=>selected.has(c.id))];};
const schoolRender=render;render=function(){if(personalView)renderPersonal();else schoolRender();let button=$('#personal');if(!button){button=btn('나만의 AAC',switchPersonal);button.id='personal';$('#teacher').before(button);}button.textContent=personalView?'학교 공통 자료':'나만의 AAC';for(const key of ['teacher','data','screen-settings']){const b=$('#'+key);if(b)b.hidden=personalView||(key==='screen-settings'&&!teacher);}if(!personalView&&path.length===4)$('#tools').append(btn('이 단원 나만의 AAC로 복사',copyCommonUnit));if(!personalView){const nav=$('#crumb');nav.replaceChildren();const indexes=[0,...path.map((_,i)=>i+1).filter(i=>!(path[0]!=='초등'&&i===2))];for(const depth of indexes){if(depth)nav.append(element('span','›'));const label=depth===0?'처음':depth===1?stageLabel(path[0]):depth===2?path[1]+'학년':depth===3?path[2]:state.units.find(u=>u.id===path[3])?.name||'단원';nav.append(btn(label,()=>{path=path.slice(0,depth);if(path.length===1&&path[0]!=='초등')path.push(1);manage=false;render();}));}if(path.length===0){const details=$('#content').querySelectorAll('.tile small');stages.forEach(([s],i)=>{if(s!=='초등'&&details[i])details[i].textContent='교과 선택';});if(screenSettings.homeIntro===DEFAULT_SCREEN.homeIntro)$('#intro').textContent='초등학교는 학년별 · 중학교·고등학교·전공과는 교과별';}if(path.length===2&&path[0]!=='초등')$('#title').textContent=stageLabel(path[0])+' · 교과';}};
const schoolNavigate=navigate;navigate=function(v){schoolNavigate(v);if(path.length===1&&path[0]!=='초등'){path.push(1);render();}};
const oldBack=$('#back').onclick;$('#back').onclick=()=>{if(personalView){personalView=false;render();return;}if(path[0]!=='초등'&&path.length===2){path=[];render();}else oldBack();};
const oldHome=$('#home').onclick;$('#home').onclick=()=>{personalView=false;oldHome();};

(async()=>{try{db=await openDB();commonData=await readKey('common')||initial();validateBackup(commonData);localDraft=await readKey('draft')||null;if(localDraft)validateBackup(localDraft);state=commonData;await getPersonal();render();await syncCommon();setupOffline()}catch(e){notify('자료 저장소를 열지 못했습니다. Edge 또는 Chrome 일반 창에서 열어 주세요. '+e.message,true)}})();
